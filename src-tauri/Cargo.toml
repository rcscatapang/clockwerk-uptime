[package]
name = "clockwerk"
version = "0.1.0"
description = "macOS menubar app monitoring HTTP(S) uptime and SSL certificates"
authors = ["Ryan Catapang"]
edition = "2021"
autobins = false

[[bin]]
name = "Clockwerk"
path = "src/main.rs"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (Windows linker quirk).
name = "clockwerk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
tauri-plugin-notification = "2"
keyring = { version = "3", features = ["apple-native"] }
native-tls = "0.2"
tokio = { version = "1", features = ["rt", "macros", "time", "sync", "net"] }
reqwest = { version = "0.12", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x509-parser = "0.18"

[dev-dependencies]
httpmock = "0.7"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
